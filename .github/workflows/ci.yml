name: CI

on:
  push:


jobs:
  lint-and-tests:
    name: Linting and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create environment file
        run: |
          echo "SECRET_KEY=ci-secret-key" >> .env
          echo "DEBUG=True" >> .env
          echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env

      - name: Run linting
        run: flake8

      - name: Run tests with coverage
        run: pytest --cov --cov-fail-under=80
  
  build-and-push-docker:
    needs: lint-and-tests
    name: Build and push Docker image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/CI-CD_pipeline_and_deployment' # TODO: change to master

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/oc-lettings:test-${{ github.sha }} # TODO: change to oc-lettings:${{ github.sha }}